<!DOCTYPE html>
<html>
<head>
  <title>VLSI & DLD Class Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #004080;
      font-size: 36px;
      margin-bottom: 40px;
    }
    .button {
      margin: 20px;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background-color: #00bfff;
      color: white;
      transition: 0.3s;
    }
    .button:hover {
      background-color: #0080ff;
    }
    .message {
      margin-top: 30px;
      font-size: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    /* Styles for each line */
    .line1 {color:#004080; font-weight:bold; font-family:Georgia, serif;}
    .line2 {color:#0066cc; font-style:italic; font-family:Tahoma, sans-serif;}
    .line3 {color:#0080ff; font-weight:bold; font-style:italic; font-family:"Courier New", monospace;}
    .line4 {color:#3399ff; font-style:normal; font-weight:normal; font-family:Verdana, sans-serif;}
    .line5 {color:#66ccff; font-weight:bold; font-style:normal; font-family:Impact, Charcoal, sans-serif;}
    .line6 {color:#0080cc; font-weight:bold; font-style:italic; font-family:"Times New Roman", serif;}
  </style>
</head>
<body>

<h1 id="greeting">Hello Mam!</h1>

<div id="buttonContainer"></div>
<div id="messageContainer" class="message"></div>

<script>
  // Greeting based on time
  const now = new Date();
  const hour = now.getHours();
  let greetingText = "";
  if(hour >= 6 && hour < 12) greetingText = "Good Morning Mam! 🌅";
  else if(hour >= 12 && hour < 17) greetingText = "Good Afternoon Mam! ☀️";
  else if(hour >= 17 && hour < 21) greetingText = "Good Evening Mam! 🌙";
  else greetingText = "Hello Mam!";
  document.getElementById("greeting").innerText = greetingText;

  // Layered messages
  const layeredMessages = [
    {text:"We sincerely apologize for disturbance caused in previous class Mam ☹️", style:"line1"},
    {text:"Ma’am, the DLD classes you taught have really strengthened our basics. Now, whenever we learn something new, we find that those concepts are very useful mam", style:"line2"},
    {text:"We deeply respect your effort in explaining every VLSI concept with clarity 🔬.", style:"line3"},
    {text:"We sincerely apologize for our behavior mam and kindly request you to guide us in this VLSI session mam 🙏, so that we can catch up fully mam", style:"line4"},
    {text:"Your dedication inspires us to focus and learn sincerely 😇. Ever since we started attending your classes, we have been listening and concentrating much more attentively. We kindly request you to continue guiding us patiently, so we can keep improving. Thank you so much, Mam, for all your efforts 🙏", style:"line5"},
    {text:"From 3rd ECE B", style:"line6"}
  ];

  let clickCount = 0;

  function nextLayer(){
    const container = document.getElementById("messageContainer");

    // Clear previous message
    container.innerHTML = "";

    // Add new message
    const p = document.createElement("p");
    p.className = layeredMessages[clickCount].style;
    p.innerText = layeredMessages[clickCount].text;
    container.appendChild(p);

    clickCount++;

    // Update button
    const btnContainer = document.getElementById("buttonContainer");
    btnContainer.innerHTML = "";

    if(clickCount < layeredMessages.length){
      const btn = document.createElement("button");
      btn.className = "button";
      btn.innerText = "Next →";
      btn.onclick = nextLayer;
      btnContainer.appendChild(btn);
    } else {
      const btn = document.createElement("button");
      btn.className = "button";
      btn.innerText = "Thank You Mam! 🙏";
      btn.onclick = () => { 
        alert("We sincerely thank you Mam! Your guidance is invaluable 😇."); 
        btnContainer.innerHTML="";
        container.innerHTML="";
      };
      btnContainer.appendChild(btn);
    }
  }

  // Show first button
  const btnContainer = document.getElementById("buttonContainer");
  const firstBtn = document.createElement("button");
  firstBtn.className = "button";
  firstBtn.innerText = "Click me 🙂";
  firstBtn.onclick = nextLayer;
  btnContainer.appendChild(firstBtn);

</script>

</body>
</html>
